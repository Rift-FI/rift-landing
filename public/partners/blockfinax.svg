<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 48" fill="none" aria-hidden="true">
  <!--
    Blockfinax partner mark. Recreation of the hexagonal favicon
    (navy hexagon with two crossed X strokes, blue over white) +
    wordmark to its right. Swap for the licensed SVG from the
    Blockfinax brand team when it arrives — keep this file path so
    the component reference doesn't need updating.
  -->
  <!-- hexagon (flat-top orientation) -->
  <polygon points="24,3 44,15 44,33 24,45 4,33 4,15" fill="#031C5F"/>
  <!-- blue X (thicker, sits underneath) -->
  <path d="M12,15 L36,33 M36,15 L12,33" stroke="#0546C2" stroke-width="7" stroke-linecap="round" fill="none"/>
  <!-- white X (crisper, sits on top) -->
  <path d="M14,17 L34,31 M34,17 L14,31" stroke="#FFFFFF" stroke-width="5.5" stroke-linecap="round" fill="none"/>
  <!-- wordmark -->
  <text x="60" y="32" font-family="Archivo, Inter, sans-serif" font-size="22" font-weight="700" letter-spacing="-0.020em" fill="#031C5F">BlockFinaX</text>
</svg>
